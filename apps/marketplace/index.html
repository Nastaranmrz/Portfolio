<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Marketplace — Prototype</title>
<link rel="icon" href="../../images/avatar.png">
<style>
@font-face{font-family:Yekan;src:url(../../Font/IRANYekanXFaNum-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Yekan;src:url(../../Font/IRANYekanXFaNum-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:Yekan;src:url(../../Font/IRANYekanXFaNum-DemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Yekan;src:url(../../Font/IRANYekanXFaNum-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
/* Every screen is laid out on the Figma frame grid (412px wide); positions come straight from the design file.
   The primary colour is the app's crimson (#DB0C1B) instead of the file's purple. */
:root{--p:#DB0C1B;--ink:#2E2E2E;--gray:#6B6B6B;--line:#BCBCBC;--bg:#F5F5F5;--white:#FCFCFC;--err:#D92D20;--field-hover:#777;--field-disabled:#D5D5D5;--field-ring:rgba(219,12,27,.14);--focus:#2E2E2E;--halo:0 0 0 4px rgba(46,46,46,.06),0 2px 12px rgba(46,46,46,.08);--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1);--halo-err:0 0 0 4px rgba(217,45,32,.09),0 2px 14px rgba(217,45,32,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
html{overflow-x:hidden}
body{direction:ltr;background:#17181B;font-family:Yekan,Tahoma,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:56px;padding:20px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block}

/* desktop presentation */
.panel{direction:ltr;font-family:"Segoe UI",system-ui,sans-serif;color:#EDEDED;width:270px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
.panel a.back{color:#9a9a9a;text-decoration:none;font-size:13px}
.panel a.back:hover{color:#fff}
.panel h1{font-size:21px;font-weight:700;margin:12px 0 6px;line-height:1.25}
.panel p{font-size:12.5px;color:#9a9a9a;line-height:1.55;margin-bottom:6px}
.panel p b{color:#ddd;font-weight:600}
.panel h6{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6f6f6f;margin:14px 0 4px 12px}
.panel nav{display:flex;flex-direction:column;gap:1px}
.panel nav button{display:block;text-align:left;padding:6px 12px;border-radius:8px;color:#cfcfcf;font-size:13px;font-family:inherit}
.panel nav button:hover{background:#232428}
.panel nav button.on{background:#2A2C30;color:#fff;box-shadow:inset 3px 0 0 var(--p)}
.device{width:432px;height:937px;border-radius:56px;background:#0B0B0C;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 2px #2a2a2e;flex:none}
.app{direction:rtl;position:relative;width:412px;height:917px;border-radius:46px;overflow:hidden;background:var(--bg)}

/* screens */
.screen{position:absolute;inset:0;display:none;background:var(--bg)}
.screen.on{display:block;animation:fade .42s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grad{background:linear-gradient(180deg,#EFEFEF 0,#FAFAFA 287px,#FAFAFA calc(100% - 68px),#EDEDED 100%)}
.ztop{position:absolute;top:0;left:0;right:0;z-index:3}
.zbg{position:absolute;inset:0;z-index:0}
.bgw{background:#FAFAFA}
.zbg>*{position:absolute}
.zbot{position:absolute;bottom:0;left:0;right:0;z-index:3}
.scroll{position:absolute;left:0;right:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:1}
.scroll::-webkit-scrollbar{display:none}
.cv{position:relative;width:412px}
#thread>*,#stBody>*,#nList>*,.ztop>*,.zbot>*,.zbg>*,.cv>*,.sh>*,.pp>*,.sd>*{position:absolute}
.t{white-space:nowrap;margin:0}
.im{max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.hs{border-radius:10px;cursor:pointer;z-index:2}
.hs:active{background:rgba(0,0,0,.05)}
.bx{z-index:1}

/* components */
.btn{display:grid;place-items:center;border-radius:10px;background:var(--p);color:#fff;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer;transition:transform .2s var(--ease),background-color .25s var(--ease),color .25s var(--ease);z-index:2}
.btn:active{transform:scale(.98)}
.btn.off{background:#E5E5E5;color:#A6A6A6;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--p);box-shadow:none}
.btn.baked{opacity:0;box-shadow:none}
/* text-field states — one system for .fld / .sbox / .sel / .msgin
   enabled → hover → focused (typing) → filled · error · disabled · read-only.
   The background never changes on hover/focus, so floating labels sitting on the border stay seamless;
   focus = crimson border + a soft, low-opacity halo around the field. */
.fld,.sbox,.sel{border:1px solid var(--line);transition:border-color .25s var(--ease),box-shadow .3s var(--ease),background-color .25s var(--ease)}
.fld{border-radius:8px;background:transparent;display:flex;align-items:center;padding:0 12px;gap:8px}
.fld input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:14px;font-weight:500;color:var(--ink);caret-color:var(--focus)}
.fld input::placeholder,.sbox input::placeholder,.msgin::placeholder{color:#9E9E9E;font-weight:400;opacity:1;transition:color .15s ease}
/* hover */
.fld:not(.err):not(.ro):not(.is-disabled):not(:has(input:disabled)):not(:focus-within):hover,
.sbox:not(.err):not(.is-disabled):not(:has(input:disabled)):not(:focus-within):hover,
.sel:not(.err):not(.is-disabled):not(:has(select:disabled)):not(:focus-within):hover{border-color:var(--field-hover)}
/* focused / typing (tappable picker fields count as focused while their sheet is open) */
.fld:focus-within:not(.err),.fld.is-active:not(.err),.sbox:focus-within,.sel:focus-within:not(.err),.sel.open:not(.err){border-color:var(--focus);box-shadow:var(--halo)}
.fld:focus-within input::placeholder,.sbox:focus-within input::placeholder{color:#BDBDBD}
.fld:focus-within+.lgd,.fld.is-active+.lgd{color:var(--ink)!important}
.fld[role=button]:focus-visible{outline:0;border-color:var(--focus);box-shadow:var(--halo)}
/* error */
.fld.err,.sel.err{border-color:var(--err);background-color:#FFF6F6}
.fld.err:focus-within,.sel.err:focus-within{box-shadow:var(--halo-err)}
.fld.err+.lgd{color:var(--err)!important}
.fld.err input{caret-color:var(--err)}
.fld.err.shake,.sel.err.shake{animation:shake .32s ease}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
/* disabled */
.fld:has(input:disabled),.fld.is-disabled,.sbox:has(input:disabled),.sbox.is-disabled,.sel:has(select:disabled),.sel.is-disabled{border-color:#E0E0E0;background:#EFEFEF;box-shadow:none;cursor:not-allowed}
.fld:has(input:disabled) input,.fld.is-disabled,.sbox:has(input:disabled) input,.sel:has(select:disabled) select{color:#A6A6A6;cursor:not-allowed}
.fld:has(input:disabled)+.lgd,.fld.is-disabled+.lgd{color:#A6A6A6!important}
/* read-only (shown, not editable): no hover/focus feedback */
.fld.ro{cursor:default}
.lgd{font-size:12px;line-height:22px;color:var(--gray);padding:0 4px;background:#FAFAFA;z-index:2;pointer-events:none;transition:color .15s ease}
.sel{border-radius:8px;background:var(--white)}
/* custom dropdown: the native <select> stays in the DOM (value, change events, validation) but is hidden;
   a button shows the value and a floating listbox menu picks it */
.sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
.sel.open{z-index:30}
.sel-btn{width:100%;height:100%;display:flex;align-items:center;padding:0 12px 0 40px;font-size:12px;font-weight:500;color:var(--ink);text-align:right;cursor:pointer;border-radius:inherit;outline:0}
.sel-btn.ph{color:#9E9E9E;font-weight:400}
.sel-btn:disabled{cursor:not-allowed;color:#A6A6A6}
.sel img{position:absolute;left:10px;top:50%;margin-top:-9px;width:18px;height:18px;pointer-events:none;transition:transform .35s var(--ease)}
.sel.open img{transform:rotate(180deg)}
.sel:has(select:disabled) img{opacity:.4}
.sel-menu{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);background:#fff;border-radius:12px;padding:6px;max-height:212px;overflow-y:auto;scrollbar-width:thin;box-shadow:0 14px 34px rgba(46,46,46,.16),0 0 0 1px rgba(46,46,46,.06);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:50% 0;transition:opacity .18s ease,transform .25s var(--ease),visibility 0s linear .25s}
.sel.up .sel-menu{top:auto;bottom:calc(100% + 6px);transform:translateY(6px) scale(.98);transform-origin:50% 100%}
.sel.open .sel-menu{opacity:1;visibility:visible;transform:none;transition:opacity .22s var(--ease),transform .32s var(--ease)}
.sel-menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--ink);text-align:right;transition:background-color .12s ease,color .12s ease}
.sel-menu button+button{margin-top:2px}
.sel-menu button:hover,.sel-menu button:focus-visible{background:#F6F6F6;outline:0}
.sel-menu button[aria-selected=true]{background:#FDECEE;color:var(--p);font-weight:700}
.sel-menu svg{flex:none;width:16px;height:16px;opacity:0;transform:scale(.6);transition:opacity .15s ease,transform .15s ease}
.sel-menu button[aria-selected=true] svg{opacity:1;transform:none}
.spin{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.blurx{backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent);mask-image:radial-gradient(closest-side,#000 70%,transparent);z-index:2;pointer-events:none}
.scan-corners,.scan-code-art{z-index:2;pointer-events:none}
/* the QR drawn in the background image is ~2px larger than the vector one, so this plate fully covers it (no stray outline) */
.scan-code-art{display:grid;place-items:center;padding:7px;background:#F5F5F5}
.scan-code-art img{display:block;width:100%;height:100%;object-fit:contain}

/* otp — same state system as the text fields, per cell:
   empty → hover → active cell (2px crimson + blinking caret) → filled · error · locked/disabled */
.otp{display:flex;gap:12px;direction:ltr}
/* each cell is its own box: hover/focus belong to the single square, not the whole row */
.otp i{position:relative;width:54px;height:54px;border:1px solid var(--line);border-radius:8px;background:transparent;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:700;color:var(--ink);cursor:text;transition:border-color .25s var(--ease),background-color .25s var(--ease),box-shadow .3s var(--ease),color .25s var(--ease)}
.otp i.filled{border-color:#8C8C8C}
.otp:not(.lock):not(.e) i:not(.cur):hover{border-color:var(--field-hover)}
.otp i.cur{border-color:var(--focus);box-shadow:var(--halo)}
.otp i.cur:empty::after{content:"";width:2px;height:24px;border-radius:1px;background:var(--focus);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.otp input{position:absolute;inset:0;opacity:0;font-size:16px;pointer-events:none}
.otp.e i{border-color:var(--err);background:#FFF6F6;color:var(--err);box-shadow:none}
.otp.e i.cur{box-shadow:var(--halo-err)}
.otp.lock i{cursor:not-allowed}
.otp.e i.cur:empty::after{background:var(--err)}
.otp.e.shake{animation:shake .32s ease}
.otp.lock{cursor:not-allowed}
.otp.lock i{border-color:#E0E0E0;background:#EFEFEF;color:#A6A6A6;box-shadow:none}
.otp.lock i::after{display:none}
.otp.lock input{pointer-events:none}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;visibility:hidden;transition:visibility 0s linear .45s}
.ov.on{visibility:visible;transition:none}
.ov .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .4s var(--ease)}
.ov.on .scrim{opacity:1}
.sh{position:absolute;left:0;right:0;bottom:0;width:412px;background:var(--white);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.ov.on .sh{transform:none}
.pp{position:absolute;top:50%;opacity:0;transform:scale(.94) translateY(8px);transition:opacity .3s var(--ease),transform .4s var(--ease);border-radius:24px}
.ov.on .pp{opacity:1;transform:none}
.sd{position:absolute;top:0;bottom:0;right:0;width:277px;background:#fff;transform:translateX(100%);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.ov.on .sd{transform:none}
.toast{position:absolute;left:50%;bottom:110px;z-index:40;transform:translate(-50%,16px);background:#2E2E2E;color:#fff;font-size:12.5px;padding:11px 16px;border-radius:12px;display:flex;gap:8px;align-items:center;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* home */
.tier{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:2}
.tier::-webkit-scrollbar{display:none}
.tier button{flex:none;width:364px;height:74px;scroll-snap-align:center}
.tier img{width:364px;height:74px}
.tile{background:var(--white);border-radius:16px;display:grid;place-items:center;cursor:pointer;z-index:2;transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
.tile:active{transform:scale(.97)}
.tile svg{width:60%;height:60%;transition:transform .45s var(--ease)}
.tile:hover{box-shadow:0 8px 20px rgba(219,12,27,.10)}
.tile:hover svg{transform:translateY(-3px)}
.rail{background:#EF737C;border-radius:0 16px 16px 0;z-index:2}
.rail .list{position:absolute;top:39px;left:0;right:15px;height:209px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail .list::-webkit-scrollbar{display:none}
.rail .list button{flex:none;width:143px;height:209px;scroll-snap-align:start}
.rail .list img{width:143px;height:209px}
.rail .all{position:absolute;left:4px;top:6px;width:50px;height:30px;z-index:2}

/* shop */
.sbox{background:var(--white);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px 0 9px;z-index:2}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:12px;height:100%}
.sbox img{width:21px;height:21px;order:2}
.dd{border:1px solid var(--line);border-radius:8px;background:var(--white);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;cursor:pointer;z-index:2}
.dd img{width:16px;height:16px;order:2}
.dd.act{border-color:var(--p);color:var(--p)}
.prodlist{left:0;width:412px;z-index:2}
.prow{position:absolute;left:0;width:412px;height:152px;cursor:pointer}
.prow>*{position:absolute}
.prow .ph{left:268px;top:8px;width:120px;height:120px;border:1px solid #DADADA;border-radius:12px;background:var(--white);overflow:hidden}
.prow .ph img{position:absolute;left:7px;top:7px;width:103px;height:103px}
.prow .ln{left:24px;top:144px;width:364px;height:1px;background:#E0E0E0}
.empty{position:absolute;left:0;right:0;top:40px;text-align:center;color:#888;font-size:13px}
.cat{width:90px;cursor:pointer}
.cat .c{width:90px;height:90px;border-radius:50%;overflow:hidden;position:relative}
.cat .c img{width:90px;height:90px}
.cat .c::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--p);opacity:0;transition:opacity .3s var(--ease)}
.cat.on .c::after{opacity:1}
.cat .c img.clip{clip-path:circle(41px at 45px 45px)}
.cat p{text-align:center;font-size:12px;line-height:22px;margin-top:8px;color:var(--gray)}
.cat.on p{color:var(--p);font-weight:700}
.acc{left:0;width:412px}
.acc>*{display:block;position:relative}
.acc .h{margin:0 24px;cursor:pointer}
/* membership cards carousel */
#cardBg img{position:absolute;left:0;top:0;width:412px;height:917px;opacity:0;transition:opacity .7s var(--ease)}
#cardBg img.on{opacity:1}
.cband{overflow:hidden;z-index:1;touch-action:pan-y;cursor:grab;user-select:none}
.cband:active{cursor:grabbing}
.cband>svg{position:absolute;left:0;top:0}
.ctrack{position:absolute;left:0;top:0;width:412px;height:100%;transition:transform .7s var(--ease);will-change:transform}
.ctrack.drag{transition:none}
.cslide{position:absolute;top:6px;width:334px;height:245px;border-radius:28px;background-size:412px 917px;background-position:-39px -106px;transition:transform .7s var(--ease),box-shadow .7s var(--ease)}
.cslide.on{box-shadow:0 12px 16px -10px rgba(0,0,0,.28)}
.cslide:not(.on){transform:scale(.755)}
.carr{display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 4px 12px rgba(0,0,0,.18);cursor:pointer;z-index:3;transition:opacity .35s var(--ease),transform .3s var(--ease),background-color .3s var(--ease),visibility 0s}
.carr:hover{background:rgba(255,255,255,.38);transform:scale(1.08)}
.carr:active{transform:scale(.94)}
.carr:focus-visible{outline:2px solid #fff;outline-offset:2px}
.carr.off{opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s linear .35s}
.carr svg{width:14px;height:14px}
.acc .b{overflow:hidden;transition:height .4s var(--ease-io)}
.acc .b.closed{height:0!important}

/* lists */
.lst{background:var(--white);border-radius:12px;overflow:hidden;z-index:2}
.lrow{position:absolute;left:0;width:364px;cursor:pointer}
.lrow>*{position:absolute}
.lrow .sep{left:0;right:0;bottom:0;height:1px;background:#EEE}
.seg{border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:12px;cursor:pointer;z-index:2}
.seg.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(219,12,27,.2)}
.nrow{position:absolute;left:24px;cursor:pointer}
.nrow img{width:364px;height:69px}

/* chat */
.chatscroll{background:#F2F2F2 url(img/chat-bg.jpg) center top/412px auto repeat-y}
.bub{max-width:263px;padding:12px 12px 8px;border-radius:16px;background:#FCE4E6;font-size:14px;line-height:25px;color:var(--ink);white-space:normal;word-wrap:break-word;z-index:2}
.bub time{display:block;text-align:left;font-size:10.5px;color:#777;margin-top:4px}
.cbar{background:#E5E5E5;z-index:3}
.cic{z-index:4;cursor:pointer;border-radius:50%;color:var(--p);transition:transform .25s var(--ease),opacity .25s var(--ease)}
.cic svg{display:block;width:24px;height:24px}
.cic:hover{transform:scale(1.1)}
.cic:active{transform:scale(.92)}
.cic:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
#micSend{display:grid}
#micSend>svg{grid-area:1/1;transition:opacity .25s var(--ease),transform .35s var(--ease)}
#micSend .i-send{opacity:0;transform:scale(.5) rotate(-30deg)}
#micSend.has-text .i-mic{opacity:0;transform:scale(.5)}
#micSend.has-text .i-send{opacity:1;transform:none}
.msgin{position:absolute;top:16px;left:24px;width:364px;height:46px;border:1px solid var(--line);outline:0;border-radius:23px;background:#FCFCFC;padding:0 48px 0 100px;font-size:14px;color:var(--ink);caret-color:var(--focus);z-index:3;transition:border-color .25s var(--ease),box-shadow .3s var(--ease)}
.msgin:hover:not(:disabled):not(:focus){border-color:var(--field-hover)}
.msgin:focus{border-color:var(--focus);box-shadow:var(--halo)}
.msgin:focus::placeholder{color:#BDBDBD}
.msgin:disabled{border-color:#E0E0E0;background:#EFEFEF;color:#A6A6A6;cursor:not-allowed}
.sbox input{caret-color:var(--focus)}
@media(prefers-reduced-motion:reduce){.fld,.sbox,.sel,.lgd,.fld input::placeholder,.sbox input::placeholder,.msgin,.otp i{transition:none}.shake,.otp i.cur:empty::after{animation:none!important}}

/* wheel + profile */
.wheel{display:flex;height:135px;z-index:2}
.wheel .col{flex:1;height:135px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:45px 0;text-align:center}
.wheel .col::-webkit-scrollbar{display:none}
.wheel .col div{height:45px;line-height:45px;scroll-snap-align:center;font-size:16px;color:#A3A3A3}
.wheel .col div.on{color:var(--ink);font-weight:700}
.wl{height:1px;background:#F6B9BF;z-index:1}

/* mobile: the app fills the screen and is scaled to the phone's width */
.menu-fab,.sheet{display:none}
@media (max-width:560px){
  body{padding:0;display:block;background:var(--bg);overflow:hidden;position:fixed;inset:0;width:100%}
  .panel{display:none}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none;overflow:hidden}

    return `<p class="t${cls}"${id}${a} style="${pos}${st}${o.st || ""}">${it.t}</p>`;
  }

  </section>`;
}
function renderOv(o) {

  const bad = ["#ordRegion", "#ordTime"].filter(s => !$(s).value);
  bad.forEach(s => flagErr($(s).parentElement));
  if (bad.length) return toast("لطفا ریجن و مدت زمان اشتراک را انتخاب کنید.");
  REQS.unshift({ s: 0, ok: false }); openOv("ordered");
};
$("#trackOrder").onclick = () => go("subs", { arg: "status", replace: true });
ENTER.sstat = (i = 0) => {
  const r = REQS[+i] || REQS[0];
  $("#ssBox").src = src(r.ok ? "ss-ok" : "ss-wait");
  ["#ssCred", "#cp1", "#cp2"].forEach(s => $(s).style.display = r.ok ? "" : "none");
  $("#ssBtn").textContent = r.ok ? "درخواست تمدید" : "پیگیری";
  $("#ssBtn").onclick = () => r.ok ? go("order") : go("chat", { arg: "اشتراک آنلاین" });
};
document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) { navigator.clipboard?.writeText(b.dataset.copy).catch(() => {}); toast("کپی شد"); } });
$("#sendRepair").onclick = () => {
  const sels = $$("#ov-repform select"), bad = sels.filter(s => !s.value);
  bad.forEach(s => flagErr(s.parentElement));
  if (bad.length) return toast("لطفا همه موارد فرم را انتخاب کنید.");
  sels.forEach(s => s.value = ""); syncSels(); openOv("repaired");
};
$$("#ov-repform select").forEach(s => s.onchange = () => s.parentElement.classList.remove("err"));

/* ================= support / chat ================= */
const THREADS = {};
let chatWith = "فروشنده";
const nowT = () => { const d = new Date(); return fa(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")); };
function renderThread() {
  const box = $("#thread"), sent = THREADS[chatWith] || [];
  let html = "", y0;
  if (chatWith === "فروشنده") {   // the designed conversation
    html = [I("chat-date", 176, 113, 60, 28), I("msg-1", 20, 149, 271, 130), I("msg-2", 20, 279, 271, 105), I("msg-3", 121, 392, 271, 105), I("msg-photo", 121, 497, 271, 410)].map(i => el(i, 0, 104, 412)).join("");
    y0 = 907 - 104 + 10;
  } else if (!sent.length) {        // the designed empty state
    html = el(I("chat-empty", 56, 360, 300, 170), 0, 104, 412); y0 = 0;
  } else y0 = 16;
  html += sent.map(m => `<div class="bub" style="right:24px">${m.t}<time>${m.at}</time></div>`).join("");
  box.innerHTML = html;
  let yy = y0;
  $$(".bub", box).forEach(b => { b.style.top = yy + "px"; yy += b.offsetHeight + 10; });
  const h = Math.max(720, yy + 10); box.style.height = h + "px"; box.closest(".cv").style.height = h + "px";
  const sc = $("#chat .scroll"); sc.scrollTop = sc.scrollHeight;
}
ENTER.chat = (who = "فروشنده") => { chatWith = who; $("#msgIn").value = ""; setMic(); renderThread(); };
const setMic = () => $("#micSend").classList.toggle("has-text", !!$("#msgIn").value.trim());
$("#msgIn").addEventListener("input", setMic);
const sendMsg = () => {
  const v = $("#msgIn").value.trim(); if (!v) return toast();
  (THREADS[chatWith] = THREADS[chatWith] || []).push({ t: v.replace(/</g, "&lt;"), at: nowT() });
  $("#msgIn").value = ""; setMic(); renderThread();
};
$("#micSend").onclick = sendMsg;
$("#msgIn").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });

/* ================= profile ================= */
let gender = 0, gPick = 0, email = "", pendingEmail = "";
const showG = g => [0, 1].forEach(i => $("#g" + i).src = src(i === g ? "rd2-on" : "rd2-off"));
OPEN.gender = () => { gPick = gender; showG(gender); };
document.addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) { gPick = +b.dataset.g; showG(gPick); } });
$("#genderOk").onclick = () => { gender = gPick; $("#fGender").textContent = gender ? "زن" : "مرد"; closeOv(); };
const MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const WV = { d: Array.from({ length: 31 }, (_, i) => fa(i + 1)), m: MONTHS, y: Array.from({ length: 70 }, (_, i) => fa(1405 - i)) };
let dateSel = { d: 6, m: 4, y: 2 };
$$("#wheel .col").forEach(col => {
  const k = col.dataset.w; col.innerHTML = WV[k].map(v => `<div>${v}</div>`).join("");
  col.addEventListener("scroll", () => { const i = Math.round(col.scrollTop / 45); dateSel[k] = i; [...col.children].forEach((c, j) => c.classList.toggle("on", j === i)); }, { passive: true });
  col.addEventListener("click", e => { const i = [...col.children].indexOf(e.target); if (i >= 0) col.scrollTo({ top: i * 45, behavior: "smooth" }); });
});
OPEN.date = () => requestAnimationFrame(() => $$("#wheel .col").forEach(col => { col.scrollTop = dateSel[col.dataset.w] * 45; col.dispatchEvent(new Event("scroll")); }));
$("#dateOk").onclick = () => { $("#fDate").textContent = `${WV.y[dateSel.y]}/${fa(String(dateSel.m + 1).padStart(2, "0"))}/${fa(String(dateSel.d + 1).padStart(2, "0"))}`; closeOv(); };
OPEN.email = () => { $("#emailIn").value = email; setTimeout(() => $("#emailIn").focus(), 280); };
$("#emailOk").onclick = () => {
  const v = $("#emailIn").value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { flagErr($("#emailIn").parentElement); return toast("ایمیل معتبر نیست."); }
  $("#emailIn").parentElement.classList.remove("err"); pendingEmail = v; go("email-otp");
};
$("#emailIn").addEventListener("input", e => e.target.parentElement.classList.remove("err"));
$("#emailIn").addEventListener("keydown", e => { if (e.key === "Enter") $("#emailOk").click(); });
const mask = e => { const [u, d] = e.split("@"); return `<span style="direction:ltr;display:inline-block">${u.slice(0, 2)}${"*".repeat(Math.max(3, u.length - 2))}@${d}</span>`; };
ENTER["email-otp"] = otpCtl("eotp", "email-otp", { tops: { normal: "eotp-top", fill: "eotp-top", err: "err-top", lock: "lock-top" }, target: () => `کد تایید<br>به ایمیل ${mask(pendingEmail || "nastaran@gmail.com")} پیامک شد.`, done: () => { email = pendingEmail || "nastaran@gmail.com"; go("email-ok", { replace: true }); } });
ENTER.userinfo = () => {
  const f = $("#fEmail");
  f.textContent = email || "ایمیل"; f.style.cssText = email ? "flex:1;text-align:right;font-size:14px;font-weight:600;direction:ltr" : "flex:1;text-align:right;font-size:12px;color:#9E9E9E";
  $("#emailLgd").style.display = email ? "" : "none";
  $("#redbar").style.display = email ? "none" : "";
};
$("#saveInfo").onclick = () => {
  const n = $("#fName");
  n.parentElement.classList.toggle("err", !n.value.trim());
  if (!n.value.trim()) return toast("نام و نام خانوادگی را وارد کنید.");
  if (!email) return toast("برای تکمیل اطلاعات، ایمیل خود را وارد کنید.");
  toast("اطلاعات ذخیره شد.");
};

/* ================= notifications ================= */
const NOTES = [{ k: "req", un: 1 }, { k: "req", un: 1 }, { k: "req", un: 1 }, { k: "msg" }, { date: 1 }, { k: "req" }, { k: "msg" }, { k: "msg" }];
let nf = "all", nEmpty = false;
function renderNotes() {
  const list = nEmpty ? [] : NOTES.map((n, i) => ({ ...n, i })).filter(n => n.date ? nf === "all" : nf === "all" || n.k === nf);
  const box = $("#nList"); let y = 0, html = "";
  if (list.some(n => !n.date)) {
    list.forEach(n => {
      if (n.date) { html += `<img src="${src("n-date")}" alt="۱۴۰۳/۱۰/۳" style="position:absolute;left:24px;top:${y + 2}px;width:364px;height:34px">`; y += 50; return; }
      html += `<div class="nrow" data-note="${n.i}" style="top:${y}px"><img src="${src(n.un ? "n-unread" : n.k === "req" ? "n-req" : "n-msg")}" alt=""></div>`; y += 81;
    });
    html += `<p class="t na" style="position:absolute;left:50%;transform:translateX(-50%);top:${y + 33}px;font-size:12px;line-height:22px;font-weight:600;color:var(--p);text-decoration:underline;text-underline-offset:5px;cursor:pointer">مشاهده بیشتر</p>`;
    y += 80;
  } else { html = el(I("notif-empty", 110, 355, 192, 155), 0, 180, 412); y = 400; }
  box.innerHTML = html; box.style.height = y + "px"; box.closest(".cv").style.height = Math.max(813, 76 + y) + "px";
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-nf]"); if (c) { nf = c.dataset.nf; $$("#notifs [data-nf]").forEach(x => x.classList.toggle("on", x === c)); renderNotes(); return; }
  const b = e.target.closest("[data-note]"); if (!b) return;
  const n = NOTES[+b.dataset.note]; n.un = 0;
  $("#ndTitle").textContent = n.k === "req" ? "درخواست فعالسازی شما با موفقیت ثبت شد." : "پیام از طرف فروشنده";
  $("#ndText").textContent = n.k === "req" ? "اپلیکیشن ساپورت موبایل‌فروشی یک پلتفرم ارتباطی و بازاریابی برای مغازه‌های فیزیکی مانند موبایل فروشی ها است." : "سلام خریدار عزیز، جهت اطلاع خدمتتون خواستم اعلام کنم فروشگاه به دلیل سفر کاری تا تاریخ ۱۴۰۳/۰۵/۱۱ تعطیل می باشد.";
  go("ndetail");
});
ENTER.notifs = arg => { nEmpty = arg === "empty"; renderNotes(); };

/* ================= start ================= */
go(location.hash.slice(1) || "splash", { reset: true });
// images of hidden screens are fetched but not decoded until shown, which made details pop in late.
// Warm them (plus the ones swapped in by script) so every screen paints complete on first view.
(() => {
  const extra = ["otp2-top", "err-top", "lock-top", "rd2-on", "rd2-off", "ic-send", "ss-ok", "ss-wait", "st-h-hours", "st-h-contact", "st-h-addr", "st-h-about"];
  const imgs = [...$$("#app img"), ...extra.map(n => Object.assign(new Image(), { src: src(n) }))];
  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 50));
  const step = () => { const batch = imgs.splice(0, 6); batch.forEach(im => im.decode?.().catch(() => {})); if (imgs.length) idle(step); };
  addEventListener("load", () => idle(step));
})();
// review helpers: ?s=600 scrolls the open screen, ?ov=name opens an overlay (used for screenshots)
const _q = new URLSearchParams(location.search);
if (_q.get("s")) setTimeout(() => $$(".screen.on .scroll").forEach(x => x.scrollTop = +_q.get("s")), 150);
if (_q.get("ov")) setTimeout(() => openOv(_q.get("ov")), 200);
</script>
</body>
</html>
